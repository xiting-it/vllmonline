# Prometheus 抓取配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # vLLMonline 平台自身的 metrics
  - job_name: "vllmonline"
    metrics_path: /metrics
    static_configs:
      - targets: ["vllmonline:8080"]
        labels:
          service: vllmonline

  # 直接抓 vLLM backend 的原生 metrics（用于 relabel 对比，SPEC §7.3）
  # vLLMonline 会在自己的 /metrics 里追加 model_version label 后再暴露。
  - job_name: "vllm-v1-raw"
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm-v1:8000"]
        labels:
          backend: vllm-v1
          model_version: v1

  # v2 启用后取消注释
  # - job_name: "vllm-v2-raw"
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["vllm-v2:8001"]
  #       labels:
  #         backend: vllm-v2
  #         model_version: v2
